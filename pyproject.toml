[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "mailru-ai-assistant"
version = "0.1.0"
description = "Минимальный CLI: чтение почты Mail.ru по IMAP и AI-анализ выбранного письма"
requires-python = ">=3.12"
dependencies = [
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pypdf>=4.0",
    "pypdfium2>=4.30",
    "pillow>=10.3",
    "pytesseract>=0.3.10",
    "streamlit>=1.40",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
e2e = ["pytest>=8.0", "pytest-playwright>=0.5", "reportlab>=4"]

[tool.setuptools.packages.find]
include = ["mail_assistant*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
